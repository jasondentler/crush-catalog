name: Commit Messages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install commit tooling
        run: uv sync --group dev

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 "${HEAD_SHA}")"
          fi

          commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")"

          if [ -z "${commits}" ]; then
            echo "No commits to validate."
            exit 0
          fi

          for commit in ${commits}; do
            message_file="$(mktemp)"
            git log --format=%B -n 1 "${commit}" > "${message_file}"
            echo "Checking ${commit}: $(head -n 1 "${message_file}")"
            uv run conventional-pre-commit \
              --strict \
              feat fix docs style refactor perf test build ci chore revert \
              "${message_file}"
            rm "${message_file}"
          done
