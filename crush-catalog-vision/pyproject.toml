[project]
name = "crush-catalog-vision"
version = "0.1.0"
description = "Computer vision helper for Crush Catalog"
requires-python = ">=3.11"
dependencies = [
    "birder>=0.4.15",
    "rawpy>=0.26.1",
    "requests>=2.33.1",
    "requests-cache>=1.3.1",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "pillow>=12.2.0",
    "numpy>=2.4.4",
    "ultralytics>=8.4.45",
    "lap>=0.5.13",
    "xview>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
