[project]
name = "crush-catalog-vision"
version = "0.1.0"
description = "Computer vision helper for Crush Catalog"
requires-python = ">=3.11"
dependencies = [
    "birder>=0.4.15",
    "rawpy>=0.26.1",
    "requests>=2.33.1",
    "requests-cache>=1.3.1",
    "python-dwca-reader>=0.16.4",
    "python-dotenv>=1.2.2",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "pillow>=12.2.0",
    "numpy>=2.4.4",
    "ultralytics>=8.4.45",
    "lap>=0.5.13",
    "xview>=0.0.6",
    "imgcat>=0.6.0",
    "climage>=0.2.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
tests = ["pytest>=8.0.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = [
    "bird_identifier",
    "cr3_handler",
    "ebird_client",
    "identification",
    "main",
    "server",
    "terminal_image",
]
